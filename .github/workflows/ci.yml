name: CI gates

# refresh.yml runs `catalog.py --check` immediately after refresh.py rebuilt
# catalog.json in the SAME job, so it can only prove catalog.py is
# deterministic — a stale or hand-edited committed catalog.json is invisible
# to it, because the build overwrote the file before the check ran. This job
# is the drift gate the docs claim: checkout, then compare the COMMITTED
# catalog.json against a fresh recompute, with nothing rebuilding it first.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Catalog drift gate (committed vs recomputed)
        run: python3 catalog.py --check
      - name: Publish leak tripwire
        run: python3 check_publish.py --scan
      - name: Redaction gate (identities never publish)
        run: python3 tests/test_redact.py
      - name: Publish allowlist regression
        run: python3 tests/test_stage.py
      - name: Digest/page parity
        run: python3 tests/test_parity.py
      - name: Shadowed-import gate
        run: python3 tests/test_shadow.py
      - name: Live-rate staleness gate
        run: python3 tests/test_rate_stale.py
      - name: Render parse gate
        run: python3 tests/test_render.py
      # Executes the committed page's scripts on the committed data.json
      # under tests/domshim.js — a runtime error that blanks the page is red
      # here even though it parses.
      - name: Render execution gate
        run: python3 tests/test_render_exec.py
      # Loop 2 (2026-09-27): one mutated data key must degrade only the
      # sections that read it (placeholder + page banner), never blank the page
      - name: Render isolation gate (data mutations)
        run: python3 tests/test_render_mutation.py
      # template-vs-template on today's data: a page change must not move a
      # rendered figure (checkout is shallow, so fetch main's tip first)
      - name: Figure parity vs main
        run: |
          git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
          python3 tests/test_figure_parity.py origin/main
      - name: Accessibility + contrast gate
        run: python3 tests/test_a11y.py
      - name: Shard corruption / atomic-write gate
        run: python3 tests/test_shards.py
      - name: Closed-day digest ledger gate
        run: python3 tests/test_digests.py
      # The tripwire that turns a silent breaking change for consumers into
      # red CI + a deliberate CONSUMERS.md / schema_version bump.
      - name: Consumer contract tests
        run: python3 tests/test_contract.py
      # Monitor-of-the-monitor (2026-09-21): the COMMITTED data.json must
      # recompute from the COMMITTED shards by an independent path. Offline
      # here (no live balance/quote legs — those run in refresh.yml where the
      # figure is minutes old); its own tier tests run just after.
      - name: Sanity gate (independent recompute-and-diff, offline)
        run: python3 sanity.py --offline
      - name: Sanity gate tier tests
        run: python3 tests/test_sanity.py
      # these three had no workflow at all until 2026-09-27 (audit A6) —
      # the era table, the cap detector and the per-category fences
      - name: Era classifier tests
        run: python3 tests/test_eras.py
      - name: Creator-reward cap detector tests
        run: python3 tests/test_cap.py
      - name: Per-category outflow fence tests
        run: python3 tests/test_fences.py
      # month-by-month closure, first-screen order, inflow wording lint
      # (council loop 1, 2026-09-27)
      - name: Decision-first page gates
        run: python3 tests/test_page.py
      # Coupon crawl vs the private coupon ledger. CI has no access to that
      # repo, so this SKIPS clean here (exit 0, loud message) and is run
      # locally with COUPON_LEDGER_PATH set; the step exists so the skip is
      # visible rather than the check being forgotten.
      - name: Coupon cross-crawler reconciliation (skips without the private ledger)
        run: python3 tests/test_coupon_reconcile.py
