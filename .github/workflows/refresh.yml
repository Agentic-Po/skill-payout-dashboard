name: Refresh dashboard
on:
  schedule:
    - cron: "3,18,33,48 * * * *"   # 4x/hour on off-peak minutes: GitHub's
      # scheduler delivers best-effort (observed 8-85%% since 2026-08-26), so
      # asking 4x yields ~hourly in practice; notify.py rate-limits the
      # Telegram digest to one per ~hour regardless of how many runs land
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # latest at checkout time, not the trigger-time SHA —
                      # a queued run replaying onto a moved main caused the
                      # 2026-08-29 14:19 rebase-conflict failure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Detector state lives in the Actions cache, NOT the public repo —
      # committing alert_state.json published armed/cooling detector state
      # hourly (timing oracle; same class as the Q3 flagged-wallets leak).
      # Worst case on cache miss: one duplicate Telegram alert, never silence.
      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: |
            alert_state.json
            guard_private.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-
      - name: Refresh data and rebuild page
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: "459477"
          POSTHOG_HOST: "https://us.posthog.com"
        run: python3 refresh.py
      # Tripwire well below GitHub's 100 MB hard limit (transfers.json hit it
      # on 2026-07-30) — a growing file should fail here, with a clear message,
      # long before pushes start bouncing.
      # Leak tripwire (council 2026-08-30): per-wallet detector scores must
      # never reach a public artifact again — fail the run before commit.
      - name: Guard against detector-signal leaks
        run: python3 check_publish.py --scan
      # refresh.py just rebuilt the catalog, so a disagreement here is proof
      # the build is not deterministic — not a stale commit.
      - name: Catalog check
        run: python3 catalog.py --check
      - name: Data contract tests
        run: |
          python3 tests/test_parity.py
          python3 tests/test_reconcile.py
      - name: Render parse gate
        run: python3 tests/test_render.py
      # Parse proves nothing about paint: this executes the freshly built
      # page's scripts on the real data.json under tests/domshim.js and
      # fails on any uncaught runtime error or an empty rendered structure.
      - name: Render execution gate
        run: python3 tests/test_render_exec.py
      - name: Guard against oversized files
        run: |
          BIG=$(find . -path ./.git -prune -o -type f -size +50M -print)
          if [ -n "$BIG" ]; then
            echo "::error::File(s) over 50 MB — shard or slim them before they hit GitHub's 100 MB push limit: $BIG"
            exit 1
          fi
      # State (alert_state.json) persists via the Actions cache post-step, not
      # commits; ordering here just keeps a Telegram hiccup from killing the
      # refresh (continue-on-error) while the data still publishes.
      - name: Anomaly & large-flow alerts
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 alerts.py
      - name: Commit and push
        run: |
          # load-bearing: Actions runs `run:` under `bash -e`, not `-eo
          # pipefail`, so without this the pipe below reports xargs' status and
          # a failed check_publish.py would stage nothing, silently.
          set -o pipefail
          git config user.name "dashboard-bot"
          git config user.email "actions@github.com"
          # An explicit allowlist, not `git add -A`: add -A closed the
          # new-state-file outage class (cognition_in.json, 2026-07-19) but
          # publishes any new private file the first time a .gitignore line is
          # forgotten. check_publish.py --stage keeps BOTH properties — it
          # warns on stderr about every unlisted working-tree file, so a new
          # file is noticed rather than silently published or silently dropped.
          # If it exits nonzero the step FAILS. Never fall back to add -A: the
          # fallback is what would publish the file the allowlist just caught.
          python3 check_publish.py --stage | xargs -d '\n' git add --
          git diff --cached --quiet || git commit -m "refresh $(date -u +'%Y-%m-%d %H:%M') UTC"
          # -X theirs: during rebase, "theirs" = this run's replayed commit,
          # so the freshly generated artifacts win conflicting hunks while
          # upstream code commits still apply cleanly. Bounded retry absorbs
          # a concurrent run pushing mid-flight.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            git rebase --abort 2>/dev/null || true
            [ "$i" = 3 ] && exit 1
            sleep $((i*10))
          done
      # External dead-man's switch: healthchecks.io expects this ping hourly
      # and alerts when it goes silent — the only leg that catches GitHub's
      # own scheduler stalling (2026-08-26: 8h account-wide cron stall).
      # No-op until the HEALTHCHECK_URL secret is configured.
      - name: Dead-man ping
        continue-on-error: true
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HC_URL" ]; then curl -fsS -m 10 --retry 3 "$HC_URL" >/dev/null && echo "ping ok"; else echo "HEALTHCHECK_URL not set — skipping"; fi
      - name: Hourly Telegram update
        continue-on-error: true   # keep the job green through a Telegram
                                  # outage (cache post-save runs regardless
                                  # of job outcome)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 notify.py hourly
      # Send-path dead-man (Cycle-3 Loop 2, item 4): the Telegram sends above
      # STAY continue-on-error (an outage must not kill a good refresh), but
      # 3+ consecutive failed send attempts on any channel mean the send path
      # itself is dead — this step is deliberately NOT continue-on-error, so
      # the workflow goes red where silence would otherwise accumulate.
      # Caveat: the counters live in the Actions cache; eviction resets them
      # (RUNBOOK-deadman.md).
      - name: Alert liveness check
        run: python3 alive_check.py
      - name: Alert Telegram on failure
        if: failure()
        run: |
          curl -s -o /dev/null "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="🔴 Skill Payout Dashboard: hourly refresh FAILED. Check https://github.com/${{ github.repository }}/actions"
      - name: Watch the ledger detector (cross-repo, non-blocking)
        if: always()
        continue-on-error: true
        env:
          LEDGER_BOT_TOKEN: ${{ secrets.LEDGER_BOT_TOKEN }}
          LEDGER_CHAT_ID:   ${{ secrets.LEDGER_CHAT_ID }}
        run: python3 ledger_watch.py
