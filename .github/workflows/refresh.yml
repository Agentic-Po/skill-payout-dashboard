name: Refresh dashboard
on:
  schedule:
    - cron: "7 * * * *"   # hourly at :07 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Detector state lives in the Actions cache, NOT the public repo —
      # committing alert_state.json published armed/cooling detector state
      # hourly (timing oracle; same class as the Q3 flagged-wallets leak).
      # Worst case on cache miss: one duplicate Telegram alert, never silence.
      - name: Restore alert state
        uses: actions/cache@v4
        with:
          path: alert_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-
      - name: Refresh data and rebuild page
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: "459477"
          POSTHOG_HOST: "https://us.posthog.com"
        run: python3 refresh.py
      # Tripwire well below GitHub's 100 MB hard limit (transfers.json hit it
      # on 2026-07-30) — a growing file should fail here, with a clear message,
      # long before pushes start bouncing.
      - name: Guard against oversized files
        run: |
          BIG=$(find . -path ./.git -prune -o -type f -size +50M -print)
          if [ -n "$BIG" ]; then
            echo "::error::File(s) over 50 MB — shard or slim them before they hit GitHub's 100 MB push limit: $BIG"
            exit 1
          fi
      # Runs before the commit step so alert_state.json (large-transfer dedup)
      # is persisted; a Telegram hiccup here must not kill the refresh.
      - name: Anomaly & large-flow alerts
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 alerts.py
      - name: Commit and push
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@github.com"
          # add -A closes the new-state-file outage class (cognition_in.json,
          # 2026-07-19: an unstaged new file broke every push for 7h);
          # .gitignore keeps alert_state.json and scratch files out
          git add -A
          git diff --cached --quiet || git commit -m "refresh $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push
      # External dead-man's switch: healthchecks.io expects this ping hourly
      # and alerts when it goes silent — the only leg that catches GitHub's
      # own scheduler stalling (2026-08-26: 8h account-wide cron stall).
      # No-op until the HEALTHCHECK_URL secret is configured.
      - name: Dead-man ping
        continue-on-error: true
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HC_URL" ]; then curl -fsS -m 10 --retry 3 "$HC_URL" >/dev/null && echo "ping ok"; else echo "HEALTHCHECK_URL not set — skipping"; fi
      - name: Hourly Telegram update
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 notify.py hourly
      - name: Alert Telegram on failure
        if: failure()
        run: |
          curl -s -o /dev/null "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode text="🔴 Skill Payout Dashboard: hourly refresh FAILED. Check https://github.com/${{ github.repository }}/actions"
      - name: Watch the ledger detector (cross-repo, non-blocking)
        if: always()
        continue-on-error: true
        env:
          LEDGER_BOT_TOKEN: ${{ secrets.LEDGER_BOT_TOKEN }}
          LEDGER_CHAT_ID:   ${{ secrets.LEDGER_CHAT_ID }}
        run: |
          python3 - <<'PYEOF'
          import json, os, time, urllib.request, urllib.parse, datetime as dt
          RAW = "https://raw.githubusercontent.com/Agentic-Po/moca-ledger/main/heartbeat.json"
          def tg(msg):
              tok, chat = os.environ.get("LEDGER_BOT_TOKEN"), os.environ.get("LEDGER_CHAT_ID")
              if not (tok and chat): return
              urllib.request.urlopen(urllib.request.Request(
                  f"https://api.telegram.org/bot{tok}/sendMessage",
                  data=urllib.parse.urlencode({"chat_id": chat, "text": msg, "parse_mode": "HTML"}).encode()), timeout=20)
          try:
              hb = json.load(urllib.request.urlopen(urllib.request.Request(RAW, headers={"User-Agent": "peer-watch"}), timeout=20))
              ts = hb.get("run_ts")
              age = (dt.datetime.now(dt.timezone.utc) - dt.datetime.fromisoformat(str(ts).replace("Z", "+00:00"))).total_seconds() / 60 if ts else 1e9
              lag = hb.get("lag_blocks") or 0
              if age > 90 or lag > 900:
                  import os.path
                  mark = "/tmp/ledger_stale_last"
                  last = 0.0
                  try:
                      last = float(open(mark).read().strip())
                  except Exception:
                      try:
                          last = float(json.load(open("alert_state.json")).get("ledger_stale_last", 0))
                      except Exception:
                          last = 0.0
                  if time.time() - last > 6 * 3600:          # dedupe: at most one every 6 h
                      tg(f"\u23f3 <b>ledger detector stale</b>\nlast run {age:.0f} min ago \u00b7 {lag} blocks behind tip\n(reported by the dashboard hourly job)")
                      try:
                          st = json.load(open("alert_state.json"))
                      except Exception:
                          st = {}
                      st["ledger_stale_last"] = time.time()
                      json.dump(st, open("alert_state.json", "w"), indent=1)
                      open(mark, "w").write(str(time.time()))
                      print("peer stale -> alerted")
                  else:
                      print("peer stale -> deduped")
              else:
                  print(f"ledger ok: {age:.0f} min old, lag {lag}")
          except Exception as e:
              tg(f"\u23f3 <b>ledger heartbeat unreadable</b>\n{str(e)[:100]}")
              print("peer unreadable ->", e)
          PYEOF
