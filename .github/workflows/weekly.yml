name: Weekly heartbeat & health check
on:
  schedule:
    - cron: "0 1 * * 1"   # Monday 01:00 UTC = 09:00 HKT
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Health check on last refresh
        id: health
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_RUN=$(gh run list --workflow refresh.yml --limit 1 --json conclusion,updatedAt -R ${{ github.repository }})
          CONCLUSION=$(echo "$LAST_RUN" | jq -r '.[0].conclusion')
          LAST_COMMIT_TS=$(git log -1 --format=%ct -- index.html)
          AGE_H=$(( ( $(date +%s) - LAST_COMMIT_TS ) / 3600 ))
          STATS=$(grep -oE '"generated": "[^"]+"' index.html | head -1)
          INVOKES=$(grep -oE '"invoke": \{"n": [0-9]+' index.html | head -1 | grep -oE '[0-9]+$')
          echo "conclusion=$CONCLUSION" >> $GITHUB_OUTPUT
          echo "age_h=$AGE_H" >> $GITHUB_OUTPUT
          echo "invokes=$INVOKES" >> $GITHUB_OUTPUT
          if [ "$CONCLUSION" = "success" ] && [ "$AGE_H" -lt 48 ]; then
            echo "status=healthy" >> $GITHUB_OUTPUT
          else
            echo "status=UNHEALTHY" >> $GITHUB_OUTPUT
          fi
      - name: Weekly Telegram digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 notify.py weekly
      # Separate always() step: a notify.py failure (e.g. stale-data
      # fail-hard) must never silence the health alert — council 2026-08-30.
      - name: Health alert (dead-man's switch — silence means broken)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            curl -s -o /dev/null "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              --data-urlencode text="⚠ HEALTHCHECK_URL secret still unset — external dead-man coverage is OFF. 15-min fix: create a healthchecks.io check (75 min grace) and add the URL as a repo secret."
          fi
          if [ "${{ steps.health.outputs.status }}" != "healthy" ]; then
            curl -s -o /dev/null "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              --data-urlencode text="🔴 Health check: last refresh run=${{ steps.health.outputs.conclusion }}, page age ${{ steps.health.outputs.age_h }}h — needs a look."
          fi
      - name: Commit heartbeat (keeps Actions cron alive)
        if: always()
        run: |
          date -u +"last heartbeat: %Y-%m-%d %H:%M UTC" > HEARTBEAT.md
          git config user.name "dashboard-bot"
          git config user.email "actions@github.com"
          git add HEARTBEAT.md && git commit -m "weekly heartbeat" || exit 0
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            git rebase --abort 2>/dev/null || true
            [ "$i" = 3 ] && exit 1
            sleep $((i*10))
          done
