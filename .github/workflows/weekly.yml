name: Weekly heartbeat & health check
on:
  schedule:
    - cron: "0 1 * * 1"   # Monday 01:00 UTC = 09:00 HKT
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Detector state lives in the Actions cache, NOT the public repo, and
      # the cache holds it ENCRYPTED with the STATE_KEY secret (2026-09-27):
      # any workflow in the repo can restore this cache, so plaintext there
      # would hand the per-wallet guard table to any workflow change. Only
      # the .enc files are cached (tools/state_crypt.py FILES; the path list
      # is held identical in refresh/daily/weekly by tests/test_state_crypt.py).
      # Worst case on cache miss: one duplicate Telegram alert, never silence.
      # Needed here too: without it notify.py's state (one-time restatement
      # stamp, hourly-digest gate, WARN queue) resets to {} in every digest.
      - name: Restore alert state (encrypted)
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            alert_state.json.enc
            guard_private.json.enc
            private_log.json.enc
          key: alert-state-enc-${{ github.run_id }}
          restore-keys: alert-state-enc-
      # One-time migration: until the first encrypted entry exists, fall back
      # to the pre-2026-09-27 PLAINTEXT entry (old path list = old cache
      # version, so it can only ever match legacy entries). state_crypt
      # decrypt uses those files as-is; the save below stores them encrypted.
      # Removable once no plaintext `alert-state-<run_id>` entry remains.
      - name: Restore legacy plaintext state (one-time migration)
        if: steps.restore.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v4
        with:
          path: |
            alert_state.json
            guard_private.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-
      # FAILS the job (and so skips the save) if STATE_KEY is missing or
      # wrong — never proceeds on empty state, never saves plaintext.
      - name: Decrypt alert state
        id: decrypt
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: python3 tools/state_crypt.py decrypt
      - name: Health check on last refresh
        id: health
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_RUN=$(gh run list --workflow refresh.yml --limit 1 --json conclusion,updatedAt -R ${{ github.repository }})
          CONCLUSION=$(echo "$LAST_RUN" | jq -r '.[0].conclusion')
          LAST_COMMIT_TS=$(git log -1 --format=%ct -- full.html)
          # page age in MINUTES against the ONE threshold in freshness.py
          # (the page's stale banner uses the same number)
          AGE_MIN=$(( ( $(date +%s) - LAST_COMMIT_TS ) / 60 ))
          AGE_H=$(( AGE_MIN / 60 ))
          STATS=$(grep -oE '"generated": "[^"]+"' full.html | head -1)
          INVOKES=$(grep -oE '"invoke": \{"n": [0-9]+' full.html | head -1 | grep -oE '[0-9]+$')
          echo "conclusion=$CONCLUSION" >> $GITHUB_OUTPUT
          echo "age_h=$AGE_H" >> $GITHUB_OUTPUT
          echo "age_min=$AGE_MIN" >> $GITHUB_OUTPUT
          echo "invokes=$INVOKES" >> $GITHUB_OUTPUT
          echo "stale_min=$(python3 -c 'import freshness;print(freshness.STALE_MINUTES)')" >> $GITHUB_OUTPUT
          echo "status=$(python3 freshness.py health "$CONCLUSION" "$AGE_MIN")" >> $GITHUB_OUTPUT
      - name: Weekly Telegram digest
        env:
          CONSOLE_URL: ${{ secrets.CONSOLE_URL }}   # Telegram "Open dashboard" -> private edition
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 notify.py weekly
      # Separate always() step: a notify.py failure (e.g. stale-data
      # fail-hard) must never silence the health alert — council 2026-08-30.
      - name: Health alert (dead-man's switch — silence means broken)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            curl -s -o /dev/null "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              --data-urlencode text="⚠ HEALTHCHECK_URL secret still unset — external dead-man coverage is OFF. 15-min fix: create a healthchecks.io check (75 min grace) and add the URL as a repo secret."
          fi
          if [ "${{ steps.health.outputs.status }}" != "healthy" ]; then
            curl -s -o /dev/null "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" \
              --data-urlencode text="🔴 Health check: last refresh run=${{ steps.health.outputs.conclusion }}, page age ${{ steps.health.outputs.age_min }} min (threshold ${{ steps.health.outputs.stale_min }} min) — needs a look."
          fi
      - name: Commit heartbeat (keeps Actions cron alive)
        if: always()
        run: |
          date -u +"last heartbeat: %Y-%m-%d %H:%M UTC" > HEARTBEAT.md
          git config user.name "dashboard-bot"
          git config user.email "actions@github.com"
          git add HEARTBEAT.md && git commit -m "weekly heartbeat" || exit 0
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            git rebase --abort 2>/dev/null || true
            [ "$i" = 3 ] && exit 1
            sleep $((i*10))
          done
      # Explicit save (replaces actions/cache's implicit post-step, which only
      # ran on job SUCCESS): runs whatever the job outcome, as long as the
      # decrypt succeeded — so a failed gate no longer discards this run's
      # state, and a missing/wrong key can never overwrite good state with
      # empty data. Only the encrypted files enter the cache.
      - name: Encrypt alert state
        id: encrypt
        if: always() && steps.decrypt.outcome == 'success'
        env:
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: python3 tools/state_crypt.py encrypt
      - name: Save alert state (encrypted only)
        if: always() && steps.encrypt.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            alert_state.json.enc
            guard_private.json.enc
            private_log.json.enc
          key: alert-state-enc-${{ github.run_id }}
